services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: expense_manager
      POSTGRES_PASSWORD: expense_manager
      POSTGRES_DB: expense_manager
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense_manager -d expense_manager"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
